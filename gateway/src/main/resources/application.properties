spring.application.name=demo
server.port=8080
# Loads LANGFUSE_AUTH from gateway/.env (git-ignored, never pushed)
spring.config.import=optional:file:.env[.properties]

# Postgres from docker-compose.yml (host port 5433)
spring.datasource.url=jdbc:postgresql://localhost:5433/gateway
spring.datasource.username=gateway
spring.datasource.password=${DB_PASSWORD:devpass}

# Flyway runs db/migration/V*.sql on startup
spring.flyway.locations=classpath:db/migration

# Fake data (DataSeeder) - only runs when the customers table is empty
app.seed.enabled=true
app.seed.customers=200

# MCP server: agents connect to http://localhost:8080/mcp
spring.ai.mcp.server.name=secure-mcp-gateway
spring.ai.mcp.server.version=0.1.0
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.protocol=STREAMABLE

# --- Tracing → Langfuse (EU cloud) over OpenTelemetry (OTLP/HTTP) ---
# record 100% of requests (default is only 10%)
management.tracing.sampling.probability=1.0
management.opentelemetry.tracing.export.otlp.endpoint=https://cloud.langfuse.com/api/public/otel/v1/traces
management.opentelemetry.tracing.export.otlp.headers.Authorization=Basic ${LANGFUSE_AUTH}
# no metrics/log export to Langfuse (it only accepts traces)
management.otlp.metrics.export.enabled=false
management.logging.export.otlp.enabled=false
# Spring AI: put tool inputs/outputs into the traces
spring.ai.tools.observations.include-content=true
# don't trace Spring Security's internal steps (too noisy in Langfuse)
management.observations.enable.spring.security=false

# --- Access security: JWT tokens (week 2, Person B) ---
# Secret used to sign and check tokens (HS256, at least 32 characters). Lives in gateway/.env
app.jwt.secret=${JWT_SECRET}
# Demo users for POST /token: username=role. They all share DEMO_PASSWORD from gateway/.env
# alice/bob/carol are the account managers in the seeded customers table
app.auth.users.alice=SUPPORT
app.auth.users.bob=SUPPORT
app.auth.users.carol=SUPPORT
app.auth.users.admin=ADMIN
app.auth.demo-password=${DEMO_PASSWORD}
app.auth.token-lifetime=15m


spring.flyway.placeholders.readonly_password=${READONLY_DB_PASSWORD:readonlydev}

app.readonly-db.url=jdbc:postgresql://localhost:5433/gateway
app.readonly-db.username=gateway_readonly
app.readonly-db.password=${READONLY_DB_PASSWORD:readonlydev}