spring.application.name=demo
server.port=8080

# Postgres from docker-compose.yml (host port 5433)
spring.datasource.url=jdbc:postgresql://localhost:5433/gateway
spring.datasource.username=gateway
spring.datasource.password=${DB_PASSWORD:devpass}

# Flyway runs db/migration/V*.sql on startup
spring.flyway.locations=classpath:db/migration

# Fake data (DataSeeder) - only runs when the customers table is empty
app.seed.enabled=true
app.seed.customers=200

# MCP server: agents connect to http://localhost:8080/mcp
spring.ai.mcp.server.name=secure-mcp-gateway
spring.ai.mcp.server.version=0.1.0
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.protocol=STREAMABLE
