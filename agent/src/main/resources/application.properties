spring.application.name=agent
# Loads GROQ_API_KEY from agent/.env (git-ignored, never pushed)
spring.config.import=optional:file:.env[.properties]
server.port=8081
spring.ai.openai.api-key=${GROQ_API_KEY}
spring.ai.openai.base-url=https://api.groq.com/openai/v1
spring.ai.openai.chat.options.model=openai/gpt-oss-20b

# MCP client: connect to our gateway's MCP server (http://localhost:8080/mcp).
# "gateway" is just a name we choose for this connection.
spring.ai.mcp.client.name=support-agent
spring.ai.mcp.client.type=SYNC
spring.ai.mcp.client.streamable-http.connections.gateway.url=http://localhost:8080
spring.ai.mcp.client.streamable-http.connections.gateway.endpoint=/mcp

# --- Tracing → Langfuse (EU cloud) over OpenTelemetry (OTLP/HTTP) ---
# record 100% of requests (default is only 10%)
management.tracing.sampling.probability=1.0
management.opentelemetry.tracing.export.otlp.endpoint=https://cloud.langfuse.com/api/public/otel/v1/traces
management.opentelemetry.tracing.export.otlp.headers.Authorization=Basic ${LANGFUSE_AUTH}
# no metrics/log export to Langfuse (it only accepts traces)
management.otlp.metrics.export.enabled=false
management.logging.export.otlp.enabled=false
# Spring AI: put the prompts, answers and tool inputs/outputs into the traces
spring.ai.chat.client.observations.log-prompt=true
spring.ai.chat.client.observations.log-completion=true
spring.ai.chat.observations.log-prompt=true
spring.ai.chat.observations.log-completion=true
spring.ai.tools.observations.include-content=true
