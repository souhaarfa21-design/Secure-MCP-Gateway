# Local Postgres for the gateway. Start with: docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    container_name: mcp-gateway-postgres
    environment:
      POSTGRES_DB: gateway
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: ${DB_PASSWORD:-devpass}
    ports:
      - "5433:5432"   # 5433 on your laptop, so it doesn't clash with a local Postgres on 5432
    volumes:
      - gateway-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d gateway"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  gateway-pgdata:
